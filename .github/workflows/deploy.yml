name: Build and Deploy Mithai

on:
  push:
    branches: [updated-mithai]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: updated-mithai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Prepare standalone bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Write PM2 ecosystem file
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 -c "
          import os, json
          config = {
            'apps': [{
              'name': 'mithai',
              'script': 'server.js',
              'env': {
                'NODE_ENV': 'production',
                'PORT': '3001',
                'MONGODB_URI': os.environ['MONGODB_URI'],
                'NEXTAUTH_SECRET': os.environ['NEXTAUTH_SECRET'],
                'NEXTAUTH_URL': os.environ['NEXTAUTH_URL'],
                'GOOGLE_CLIENT_ID': os.environ['GOOGLE_CLIENT_ID'],
                'GOOGLE_CLIENT_SECRET': os.environ['GOOGLE_CLIENT_SECRET'],
                'RAZORPAY_KEY_ID': os.environ['RAZORPAY_KEY_ID'],
                'RAZORPAY_KEY_SECRET': os.environ['RAZORPAY_KEY_SECRET'],
                'NEXT_PUBLIC_RAZORPAY_KEY_ID': os.environ['NEXT_PUBLIC_RAZORPAY_KEY_ID'],
                'CLOUDINARY_CLOUD_NAME': os.environ['CLOUDINARY_CLOUD_NAME'],
                'CLOUDINARY_API_KEY': os.environ['CLOUDINARY_API_KEY'],
                'CLOUDINARY_API_SECRET': os.environ['CLOUDINARY_API_SECRET'],
              }
            }]
          }
          js = 'module.exports = ' + json.dumps(config, indent=2)
          open('.next/standalone/ecosystem.config.js', 'w').write(js)
          print('ecosystem.config.js written successfully')
          "

      - name: Deploy to DigitalOcean
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DO_HOST }}
          REMOTE_USER: ${{ secrets.DO_USER }}
          SOURCE: ".next/standalone/"
          TARGET: "/var/www/mithai/"
          ARGS: "-rlgoDzvc --delete"
          EXCLUDE: "/.git/"

      - name: Restart app with PM2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            cd /var/www/mithai
            pm2 start ecosystem.config.js || pm2 restart ecosystem.config.js --update-env
            pm2 save
